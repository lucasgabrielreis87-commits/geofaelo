<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>

<body>
    <form id="form1">
         <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
        <input type="text" name="username" placeholder="email de login">
        <input type="password" name="password" placeholder="senha">
        <link rel="stylesheet" href="login.css">
        <button>entrar</button>
    </form>
    <form id="form2">
        <input type="text" name="username" id="nome" placeholder="username">
        <input type="password" name="password" placeholder="senha">
        <button id="btCadastro">cadastrar-se</button>
    </form>
    <script>


        const frmLogin = document.querySelector('#form1')

        frmLogin.addEventListener('submit', async (ev) => {
            ev.preventDefault()
            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-type": "application/json" },
                body: JSON.stringify({
                    "username": frmLogin.username.value,
                    "password": frmLogin.password.value
                })
            })

            if (response.status == 404)
                return alert("Usuário não encontrado")

            if (response.status == 401)
                return alert("Senha incorreta")

            if (response.ok) {
                window.location.href = "/home"
                return
            }

            alert("Não deveria chegar aqui")
        })
        const frmCadastro = document.querySelector('#form2')
        frmCadastro.addEventListener('submit', async (ev) => {
            ev.preventDefault()
            const response = await fetch("/user", {
                method: "POST",
                headers: { "Content-type": "application/json" },
                body: JSON.stringify({
                    "username": frmCadastro.username.value,
                    "password": frmCadastro.password.value
                })
            })
            frmCadastro.username.value = ""
            frmCadastro.password.value = ""
        })

    </script>
</body>

</html>
